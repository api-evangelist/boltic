- aid: boltic:tables-api
  name: Boltic Tables API
  tags:
  - CRUD
  - Databases
  - No-Code
  - Tables
  tags_raw:
  - CRUD
  - Databases
  - NoCode
  - Tables
  humanURL: https://www.boltic.io/products/boltic-tables
  properties:
  - url: https://docs.boltic.io/docs/workflow-builder/activities/tables/
    type: Documentation
  - url: openapi/boltic-tables-api-openapi.yml
    type: OpenAPI
  - url: json-schema/boltic-table.json
    type: JSONSchema
  description: >-
    The Boltic Tables API provides programmatic access to Boltic Tables, a no-code database for teams
    to organize, manage, and automate structured data workflows. The API supports full CRUD operations
    on tables and rows, SQL query execution via a built-in SQL editor with AI-powered query generation,
    and integration with workflows for automated data processing triggered by table changes.
- aid: boltic:pipes-api
  name: Boltic Pipes API
  tags:
  - Data Sync
  - ETL
  - Integration
  - Pipelines
  tags_raw:
  - DataSync
  - ETL
  - Integration
  - Pipelines
  humanURL: https://docs.boltic.io/docs/pipes/pipe-creation/
  properties:
  - url: https://docs.boltic.io/docs/pipes/pipe-creation/
    type: Documentation
  - url: openapi/boltic-pipes-api-openapi.yml
    type: OpenAPI
  - url: json-schema/boltic-pipe.json
    type: JSONSchema
  description: >-
    The Boltic Pipes API provides programmatic access to data synchronization pipelines that connect data
    sources to destinations. Pipes enable real-time data syncing across systems via automated pipelines
    with zero maintenance. Sources include databases such as MongoDB, MySQL, and PostgreSQL, SaaS applications
    via API endpoints, and file storage. The API supports configurable sync frequencies including minutely,
    hourly, and daily schedules.
